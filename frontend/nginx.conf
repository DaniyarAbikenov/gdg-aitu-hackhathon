server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    location = /openapi.json {
        proxy_pass http://backend:8080/openapi.json;
        proxy_set_header Host $http_host;
    }
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $http_host;
    }
    location = /api/session {
        proxy_pass http://backend:8080/api/session;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 90s;
    }
    location / {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data:; font-src 'self'; connect-src 'self' https://accounts.google.com https://api.openai.com; media-src 'self' blob:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
