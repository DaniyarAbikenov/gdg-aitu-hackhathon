name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: career_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career -d career_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CAREER_DATABASE_URL: postgresql+psycopg://career:test-only@localhost:5432/career_test
      CAREER_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180
        env:
          CAREER_PROVIDER: local
      - run: curl --fail http://127.0.0.1:8080/health
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure
          path: |
            test-results
            compose.log
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
