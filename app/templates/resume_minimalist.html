<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
body {
  font-family: Inter, Arial, sans-serif;
  margin: 50px;
  color: #000;
  line-height: 1.55;
}
header {
  display: flex;
  justify-content: space-between;
}
.name {
  font-size: 28px;
  font-weight: 600;
}
.meta {
  text-align: right;
  color: #666;
  font-size: 12px;
}
.section {
  margin-top: 32px;
}
.section-title {
  font-size: 14px;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 1px;
  color: #555;
  margin-bottom: 10px;
}
.badges span {
  background: #eee;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  margin-right: 6px;
  margin-bottom: 6px;
  display: inline-block;
}
.exp-item {
  margin-bottom: 18px;
}
.exp-role {
  font-weight: 600;
}
.exp-company {
  color: #444;
}
.exp-dates {
  font-size: 11px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <div class="name">[FULL_NAME]</div>
  <div class="meta">
    [EMAIL]<br/>
    [PHONE]<br/>
    [LOCATION]
  </div>
</header>

<div class="section">
  <div class="section-title">Summary</div>
  <div>[SUMMARY_HTML]</div>
</div>

<div class="section">
  <div class="section-title">Skills</div>
  <div class="badges">[SKILLS_HTML]</div>
</div>

<div class="section">
  <div class="section-title">Experience</div>
  <div>[EXPERIENCE_HTML]</div>
</div>

<div class="section">
  <div class="section-title">Education</div>
  <div>[EDUCATION_HTML]</div>
</div>

</body>
</html>
