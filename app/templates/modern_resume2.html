<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - [FULL_NAME]</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            color: #333;
            margin: 40px;
        }
        h1, h2 {
            margin: 0;
            padding: 0;
            font-weight: normal;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            margin-top: 20px;
        }
        .contact {
            font-size: 16px;
            margin-bottom: 20px;
            color: #666;
        }
        .section-title {
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        .experience, .education, .projects, .skills {
            margin-bottom: 20px;
        }
        .exp-item, .edu-item, .project-item {
            margin-bottom: 15px;
        }
        .exp-item-title, .edu-item-title, .project-item-title {
            font-weight: bold;
        }
        .exp-item-company, .edu-item-institution {
            color: #555;
        }
        .exp-item-dates, .edu-item-dates {
            font-size: 12px;
            color: #777;
        }
        .skills-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-badge {
            background: #f4f4f4;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>[FULL_NAME]</h1>
        <div class="contact">
            <span>[EMAIL]</span> · <span>[PHONE]</span> · <span>[LOCATION]</span>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">Summary</h2>
        <p>[SUMMARY_HTML]</p>
    </div>

    <div class="section">
        <h2 class="section-title">Skills</h2>
        <div class="skills-badges">
            [SKILLS_HTML]
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">Experience</h2>
        [EXPERIENCE_HTML]
    </div>

    <div class="section">
        <h2 class="section-title">Education</h2>
        [EDUCATION_HTML]
    </div>

    <div class="section">
        <h2 class="section-title">Projects</h2>
        [PROJECTS_HTML]
    </div>

</body>
</html>
