<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
body {
  font-family: Arial, sans-serif;
  margin: 40px;
  color: #111;
  line-height: 1.55;
}
h1 {
  font-size: 28px;
  margin-bottom: 4px;
}
.contact {
  color: #555;
  font-size: 13px;
  margin-bottom: 24px;
}
.section-title {
  margin-top: 28px;
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 16px;
  border-bottom: 1px solid #ddd;
}
.skill-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.skill-badge {
  background: #f2f2f2;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
}
.exp-item {
  margin-bottom: 14px;
}
.exp-item-title {
  font-weight: bold;
}
.exp-item-company {
  color: #444;
}
.exp-item-dates {
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<h1>[FULL_NAME]</h1>
<div class="contact">[EMAIL] · [PHONE] · [LOCATION]</div>

<div class="section-title">Summary</div>
<div>[SUMMARY_HTML]</div>

<div class="section-title">Skills</div>
<div class="skill-badges">[SKILLS_HTML]</div>

<div class="section-title">Experience</div>
<div>[EXPERIENCE_HTML]</div>

<div class="section-title">Education</div>
<div>[EDUCATION_HTML]</div>

</body>
</html>
