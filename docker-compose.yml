# Shared by the API and the worker, which run the same use cases.
x-career-environment: &career-environment
  CAREER_DATABASE_URL: postgresql+psycopg://career:${CAREER_DB_PASSWORD:-career-local-only}@postgres:5432/career
  CAREER_REDIS_URL: redis://redis:6379/0
  CAREER_GOOGLE_CLIENT_ID: ${CAREER_GOOGLE_CLIENT_ID:-}
  CAREER_ENVIRONMENT: ${CAREER_ENVIRONMENT:-production}
  CAREER_SESSION_CREATIONS_PER_HOUR: ${CAREER_SESSION_CREATIONS_PER_HOUR:-30}
  CAREER_AUTH_PER_15_MINUTES: ${CAREER_AUTH_PER_15_MINUTES:-15}
  CAREER_ADMIN_EMAILS: ${CAREER_ADMIN_EMAILS:-}
  CAREER_OPENAI_REALTIME_MODEL: ${CAREER_OPENAI_REALTIME_MODEL:-}
  CAREER_OPENAI_TRANSCRIPTION_MODEL: ${CAREER_OPENAI_TRANSCRIPTION_MODEL:-}
  CAREER_PROVIDER: ${CAREER_PROVIDER:-unconfigured}
  CAREER_OPENAI_API_KEY: ${CAREER_OPENAI_API_KEY:-}
  CAREER_OPENAI_MODEL: ${CAREER_OPENAI_MODEL:-}
  CAREER_GEMINI_API_KEY: ${CAREER_GEMINI_API_KEY:-}
  CAREER_GEMINI_MODEL: ${CAREER_GEMINI_MODEL:-}
  CAREER_SECURE_COOKIE: ${CAREER_SECURE_COOKIE:-false}
  CAREER_SESSION_HOURS: ${CAREER_SESSION_HOURS:-24}
  CAREER_ANALYSIS_PER_HOUR: ${CAREER_ANALYSIS_PER_HOUR:-30}
  CAREER_AI_INPUT_USD_PER_MILLION: ${CAREER_AI_INPUT_USD_PER_MILLION:-0}
  CAREER_AI_OUTPUT_USD_PER_MILLION: ${CAREER_AI_OUTPUT_USD_PER_MILLION:-0}
  CAREER_LOG_LEVEL: ${CAREER_LOG_LEVEL:-INFO}
  CAREER_SENTRY_DSN: ${CAREER_SENTRY_DSN:-}
  CAREER_OTEL_ENABLED: ${CAREER_OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  # Locally, mail goes to Mailpit (http://127.0.0.1:8025). Set it to empty to turn email off.
  CAREER_SMTP_URL: ${CAREER_SMTP_URL-smtp://mailpit:1025}
  CAREER_MAIL_FROM: ${CAREER_MAIL_FROM:-Career Studio <no-reply@career.local>}
  CAREER_PUBLIC_URL: ${CAREER_PUBLIC_URL:-http://localhost:${CAREER_PORT:-8080}}

services:
  mailpit:
    # Catches every outgoing email for local development and browser tests; nothing leaves.
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${CAREER_MAIL_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${CAREER_DB_PASSWORD:-career-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      CAREER_DATABASE_URL: postgresql+psycopg://career:${CAREER_DB_PASSWORD:-career-local-only}@postgres:5432/career
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      target: runtime
    environment: *career-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    build:
      context: .
      target: runtime
    # Runs slow AI requests queued by the API (Prefer: respond-async).
    command: ["python", "-m", "app.worker"]
    environment: *career-environment
    healthcheck:
      # The worker's Redis registration expires unless its heartbeat keeps it alive.
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${CAREER_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
